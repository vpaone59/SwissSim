{% extends "tournaments/layout/layout.html" %}
{% load static %}
{% block title %}Standings - CS2 Tournament{% endblock %}
{% block content %}
    <div class="container  py-4">
        <h1 class="text-center mb-4">Tournament Standings</h1>
        <div class="row">
            <div class="col-md-12">
                <div class="card bg-light border-secondary">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="h3 mb-0">Current Standings</h2>
                        <button class="btn btn-sm btn-outline-light"
                                hx-get="{% url 'standings' %}"
                                hx-target="#standings-table-container"
                                hx-swap="innerHTML"
                                hx-trigger="click">Refresh</button>
                    </div>
                    <div class="card-body">
                        <div id="standings-table-container" class="table-responsive">
                            {% include "tournaments/partials/standings_table.html" with teams=teams %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="{% url 'tournament_home' %}" class="btn btn-outline-light">Back to Tournament Home</a>
        </div>
    </div>
{% endblock %}
