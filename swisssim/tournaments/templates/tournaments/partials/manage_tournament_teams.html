<div class="row">
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-header bg-light">
                <h4>Available Teams</h4>
                <div class="input-group mt-2">
                    <input type="text"
                           class="form-control"
                           placeholder="Search teams..."
                           hx-post="{% url 'search_available_teams' tournament.id %}"
                           hx-trigger="keyup changed delay:500ms"
                           hx-target="#availableTeamsList">
                </div>
            </div>
            <div class="card-body overflow-auto" style="max-height: 500px;">
                <div id="availableTeamsList" class="list-group">
                    {% include "tournaments/partials/available_teams_list.html" with available_teams=available_teams %}
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-header bg-light">
                <h4>Tournament Teams</h4>
                <div class="input-group mt-2">
                    <input type="text"
                           class="form-control"
                           placeholder="Search tournament teams..."
                           hx-post="{% url 'search_tournament_teams' tournament.id %}"
                           hx-trigger="keyup changed delay:500ms"
                           hx-target="#tournamentTeamsList">
                </div>
            </div>
            <div class="card-body overflow-auto" style="max-height: 500px;">
                <div id="tournamentTeamsList" class="list-group">
                    {% include "tournaments/partials/tournament_teams_list.html" with tournament_teams=tournament_teams %}
                </div>
            </div>
        </div>
    </div>
</div>
<div class="text-end mt-3">
    <button class="btn btn-secondary"
            hx-get="{% url 'tournament_teams_view' tournament.id %}"
            hx-target="#teamsManagementSection">Done</button>
</div>
