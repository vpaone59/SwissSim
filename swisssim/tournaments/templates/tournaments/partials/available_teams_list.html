{% for team in available_teams %}
    <div class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <span class="fw-bold">{{ team.team_name }}</span>
            <small class="text-muted ms-2">{{ team.region }}</small>
        </div>
        <button class="btn btn-sm btn-success"
                hx-post="{% url 'add_team_to_tournament' tournament.id team.id %}"
                hx-swap="outerHTML"
                hx-target="#availableTeamsList, #tournamentTeamsList"
                title="Add to tournament">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>
{% empty %}
    <div class="list-group-item text-center text-muted">No available teams found</div>
{% endfor %}
